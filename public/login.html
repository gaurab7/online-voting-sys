<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voeter Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <form id="loginForm">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
                <optgroup label="Select Course">
                    <option value="">--Select Course--</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BIT">BIT</option>
                    <option value="BIM">BIM</option>
                    <option value="BSc">BSc</option>
                </optgroup>
            </select><br><br>

            <label for="semester">Semester:</label><br>
            <select id="semester" name="semester" required>
                <optgroup label="Select Semester">
                    <option value="">--Select Semester--</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </optgroup>
            </select><br><br>

            <label for="roll">Roll No:</label><br>
            <input type="text" id="roll" name="roll" required><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <button type="submit">Login</button>
        </form>
        <br>
        <label for="idIMG">Or Scan ID Image:</label><br>
        <input type="file" id="idIMG" accept="image/*"><br><br>
        <button id="scanIMG" disabled onclick="scanIMG()">Scan ID Image</button>

    </div>

    <script src="/client.js"></script>
</body>
</html>
